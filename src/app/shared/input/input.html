<div class="form-field" [class.disabled]="disabled()">
    @if (label()) {
    <label>
        {{ label() }} @if (required()) { <span class="required">*</span> }
    </label>
    }
    <input [type]="type()" [value]="value()" [placeholder]="placeholder()" [disabled]="disabled()"
        (input)="onInput($event)" />
</div>
