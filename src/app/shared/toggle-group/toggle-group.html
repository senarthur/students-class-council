<div class="toggle-group-container">
    @if (label()) {
    <label>{{ label() }}</label>
    }
    <div class="toggle-buttons">
        @for (opt of options(); track opt.label) {
        <input type="button" class="toggle-btn" value="{{opt.label}}" [class.active]="value() === opt.value"
            (click)="onSelect(opt.value)">
        }
    </div>
</div>
