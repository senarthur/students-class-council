<app-sidebar></app-sidebar>

<section>
    <app-header [title]="title()" [helpText]="helpText()" />

    <div class="action-bar">
        <app-button variant="white" routerLink="/estudantes">
            <i class="fa fa-solid- fa-arrow-left"></i>
            Voltar para alunos
        </app-button>
    </div>

    <app-base-card>
        <form class="form-container">

            <!-- 1. Identificação -->
            <fieldset class="form-section">
                <legend class="section-title">1. Identificação</legend>
                <p class="section-description">Preencha os dados básicos para identificar o estudante.</p>
            </fieldset>

            <div class="identification-grid">
                <label class="photo-upload-box">
                    @if (student) {
                    <img class="photo-preview" [src]="student.profileUrl" alt="Foto de {{ student.name }}">
                    }
                    <span class="upload-icon">+</span>
                    <span>Adicionar foto</span>
                    <input type="file" name="image-upload" id="image-upload" accept="image/*">
                </label>
                <app-input label="Nome completo" placeholder="Nome completo do estudante" required="true"
                    [value]="student?.name" />
                <app-input label="Data de nascimento" placeholder="DD/MM/AAAA"
                    [value]="student?.registration?.toDateString()" />
            </div>

            <hr class="fieldset-divider">

            <!-- 2. Informações Escolares -->
            <fieldset class="form-section">
                <legend class="section-title">2. Informações Escolares</legend>
            </fieldset>

            <div class="school-grid">
                <app-select name="turma" placeholder="Selecione uma turma" label="Turma" required="true"
                    [options]="classes()" [value]="student?.grade"></app-select>
                <app-select name="turno" placeholder="Selecione o turno" label="Turno" required="true"
                    [options]="shift()" [value]="student?.shift"></app-select>
                <app-select name="situacao" placeholder="Situação" label="Situação" required="true" [options]="status()"
                    [value]="student?.status"></app-select>
            </div>

            <hr class="fieldset-divider">

            <!-- 3. Informações de acompanhamento -->
            <fieldset class="form-section">
                <legend class="section-title">3. Informações de acompanhamento</legend>
            </fieldset>

            <div class="additional-info">
                <app-toggle-group label="Participa do PEI" [value]="student?.hasPei"></app-toggle-group>
                <app-toggle-group label="Há transtorno ou condição relevante para o acompanhamento?"
                    [value]="student?.disorderInfo?.hasDisorder"></app-toggle-group>
            </div>

            <div class="action-buttons">
                <app-button variant="outline">Cancelar</app-button>
                <app-button>Cadastrar aluno</app-button>
            </div>
        </form>
    </app-base-card>
</section>
